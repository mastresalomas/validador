/* ============================ componente ============================ */
function ValidadorPedidos() {
  const [operador, setOperador] = useState("");
  const [nomeSalvo, setNomeSalvo] = useState(false);
  const [arquivo, setArquivo] = useState(null);
  const [bruto, setBruto] = useState(null);
  const [titulos, setTitulos] = useState(null);
  const [arquivoTit, setArquivoTit] = useState(null);
  const [carregandoTit, setCarregandoTit] = useState(false);
  const [falha, setFalha] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [arrastando, setArrastando] = useState(false);
  const [fila, setFila] = useState("comercial");
  const [abertos, setAbertos] = useState(new Set());
  const [historico, setHistorico] = useState([]);
  const [verHistorico, setVerHistorico] = useState(false);
  const inputRef = useRef(null);
  const inputTitRef = useRef(null);

  useEffect(() => {
    (async () => {
      const n = await lerGuardado(CHAVE_NOME);
      if (n) { setOperador(n); setNomeSalvo(true); }
      const h = await lerGuardado(CHAVE_HIST);
      setHistorico(Array.isArray(h) ? h : []);
    })();
  }, []);

  async function salvarNome() {
    const l = operador.trim();
    if (!l) return;
    await gravarGuardado(CHAVE_NOME, l);
    setOperador(l); setNomeSalvo(true);
  }

  async function receberArquivo(f) {
    if (!f) return;
    setFalha(""); setCarregando(true); setBruto(null); setAbertos(new Set());
    try {
      const { colunas, linhas } = await lerPlanilha(f);
      const { mapa, faltando } = detectarColunas(colunas);
      if (faltando.length) {
        throw new Error(
          `A planilha não tem as colunas: ${faltando.join(", ")}. ` +
          `Esperado o layout do Dashboard (Pedido, Cliente, Código, Produto, Qtde, Val.Unit., Val.Total, Bonificado, Lib.Coml, Lib.Fin.).`
        );
      }
      // um pedido por vez, depois agrupados em negociações
      const porPedido = new Map();
      const ordem = [];
      for (const l of linhas) {
        const id = String(l[mapa.pedido] ?? "").trim();
        if (!id) continue;
        if (!porPedido.has(id)) { porPedido.set(id, []); ordem.push(id); }
        porPedido.get(id).push(l);
      }

      // histórico do cliente: NFs distintas por CNPJ em toda a base.
      // Vale como total de pedidos faturados só se o arquivo trouxer o histórico
      // completo; num recorte mensal, conta apenas as NFs do período.
      const historico = new Map();
      if (mapa.notaFiscal) {
        const porCliente = new Map();
        for (const l of linhas) {
          const nf = String(l[mapa.notaFiscal] ?? "").trim();
          if (!nf || nf === "0") continue;
          // agrupa pela raiz do CNPJ (8 primeiros dígitos) para somar as
          // filiais de um mesmo cliente; sem CNPJ, cai no nome
          const cnpj = mapa.cnpj ? normCnpj(l[mapa.cnpj]) : "";
          const cli = cnpj && !/^0+$/.test(cnpj) ? cnpj.slice(0, 8) : normalizar(l[mapa.cliente]);
          if (!cli) continue;
          if (!porCliente.has(cli)) porCliente.set(cli, new Set());
          porCliente.get(cli).add(nf);
        }
        for (const [cli, nfs] of porCliente) historico.set(cli, nfs.size);
      }
      // mesmo cliente + mesma data = uma negociação; bonificação fica sempre à parte
      const porNegociacao = new Map();
      for (const id of ordem) {
        const ls = porPedido.get(id);
        const bonif = pedidoEhBonificacao(ls, mapa);
        const quem = mapa.cnpj
          ? normCnpj(ls[0][mapa.cnpj]) || String(ls[0][mapa.cliente] ?? "").trim()
          : String(ls[0][mapa.cliente] ?? "").trim();
        const quando = mesDe(ls[0][mapa.dataPedido]);
        // bonificação e pedido reprovado ou cancelado ficam fora da soma
        const chave = bonif
          ? `bonificacao|${id}`
          : pedidoEntraNaSoma(ls, mapa)
          ? `${quem}|${quando}`
          : `foradasoma|${id}`;
        if (!porNegociacao.has(chave))
          porNegociacao.set(chave, { ids: [], linhas: [], porPedido: new Map(), bonificacao: bonif });
        const n = porNegociacao.get(chave);
        n.ids.push(id);
        n.linhas.push(...ls);
        n.porPedido.set(id, ls);
      }
      setArquivo(f);
      setBruto({ porNegociacao, mapa, historico, totalLinhas: linhas.length, temCnpj: !!mapa.cnpj });
    } catch (e) {
      setFalha(e.message || "Não deu para ler esse arquivo.");
      setArquivo(null);
    } finally {
      setCarregando(false);
    }
  }

  async function receberTitulos(f) {
    if (!f) return;
    setFalha(""); setCarregandoTit(true);
    try {
      const r = await lerTitulos(f);
      setArquivoTit(f);
      setTitulos(r);
    } catch (e) {
      setFalha(e.message || "Não deu para ler a base de títulos.");
      setArquivoTit(null); setTitulos(null);
    } finally {
      setCarregandoTit(false);
    }
  }

  const dados = useMemo(() => {
    if (!bruto) return null;
    const mapaTit = titulos || null;
    const pedidos = [];
    for (const n of bruto.porNegociacao.values()) {
      const resumo = resumirNegociacao(n.ids, n.linhas, bruto.mapa);
      for (const id of n.ids) {
        pedidos.push(analisarPedido(id, n.porPedido.get(id), bruto.mapa, mapaTit, resumo, bruto.historico));
      }
    }
    return { pedidos, totalLinhas: bruto.totalLinhas };
  }, [bruto, titulos]);

  const visiveis = useMemo(() => {
    if (!dados) return [];
    // um pedido já faturado, separado ou cancelado passou da análise comercial,
    // mesmo que a coluna de liberação tenha vindo vazia no export
    const JA_SEGUIU = ["FATURADO", "EM SEPARACAO", "CANCELADO"];
    const seguiu = (p) => JA_SEGUIU.some((x) => normalizar(p.status).includes(x));
    const f = (p) => {
      if (fila === "comercial") return p.libComl === "" && !seguiu(p);
      if (fila === "financeiro")
        return p.libComl.toLowerCase() === "true" && p.libFin === "" && !seguiu(p);
      return true;
    };
    const lista = dados.pedidos.filter(f);

    // bonificação que caiu um dia antes ou depois entra no grupo do pedido
    const chaveOrdem = (p) => paraData(p.data) ?? 99999999;
    const naoBonif = lista.filter((p) => p.tipo !== "bonificacao");
    for (const b of lista.filter((p) => p.tipo === "bonificacao")) {
      const d = chaveOrdem(b);
      const perto = naoBonif.find(
        (p) => p.cnpj && p.cnpj === b.cnpj && Math.abs(chaveOrdem(p) - d) <= 1
      );
      if (perto) b.grupo = perto.grupo;
    }

    // pedidos do mesmo cliente ficam em sequência; os grupos vão do mais
    // antigo no topo para o mais recente embaixo
    const grupos = new Map();
    for (const p of lista) {
      if (!grupos.has(p.grupo)) grupos.set(p.grupo, []);
      grupos.get(p.grupo).push(p);
    }
    return [...grupos.values()]
      .map((g) => {
        g.sort((a, b) => chaveOrdem(a) - chaveOrdem(b) || a.id.localeCompare(b.id));
        return { g, quando: Math.min(...g.map(chaveOrdem)) };
      })
      .sort((a, b) => a.quando - b.quando || a.g[0].id.localeCompare(b.g[0].id))
      .flatMap(({ g }) => g);
  }, [dados, fila]);

  const contagem = useMemo(() => {
    const c = { inadimplente: 0, erro: 0, carta: 0, alerta: 0, negociado: 0, kit: 0, liberado: 0, bonificacao: 0 };
    visiveis.forEach((p) => { c[p.veredito] += 1; });
    // o verde conta tudo que pode seguir, inclusive com ressalva — por isso a
    // soma dos contadores passa do total de pedidos, de propósito
    c.liberado = visiveis.filter((p) => ["liberado", "alerta", "carta", "kit"].includes(p.veredito)).length;
    return c;
  }, [visiveis]);

  useEffect(() => {
    if (!dados || !arquivo || !visiveis.length) return;
    (async () => {
      const reg = {
        quando: agora(), quem: operador || "sem nome", arquivo: arquivo.name,
        fila, pedidos: visiveis.length, bloqueados: contagem.erro + contagem.inadimplente, atencao: contagem.alerta,
      };
      const atual = (await lerGuardado(CHAVE_HIST)) || [];
      const novo = [reg, ...(Array.isArray(atual) ? atual : [])].slice(0, 40);
      if (await gravarGuardado(CHAVE_HIST, novo)) setHistorico(novo);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [dados, fila]);

  function alternar(id) {
    setAbertos((a) => {
      const n = new Set(a);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });
  }

  function exportar() {
    const saida = [];
    for (const p of visiveis) {
      if (p.veredito === "liberado") continue;
      const cab = {
        Pedido: p.id, Mercos: p.mercos || "", Pedidos: (p.pedidos || []).length, Cliente: p.cliente, Documento: p.doc || "", ValoresEmAberto: p.passivo ? p.passivo.valor.toFixed(2).replace(".", ",") : "", NFsCliente: p.nfsCliente != null ? p.nfsCliente : "", ClienteNovo: p.nfsCliente != null && p.nfsCliente <= 1 ? "sim" : "", Representante: p.representante || "", Observacoes: p.observacoes || "", UF: p.uf || "", MC: p.margem ? (p.margem.pct*100).toFixed(1).replace(".",",")+"%" : "", Data: p.data, CondPgto: p.condPgto,
        TotalPA: (p.totalBruto ?? 0).toFixed(2).replace(".", ","),
        Pagamento: p.pagto ? p.pagto.nome : "",
        Proteina: p.fatia != null ? (p.fatia * 100).toFixed(1) + "%" : "",
        Faixa: p.faixa ? p.faixa.rotulo : "—",
        Veredito: { inadimplente: "INADIMPLENTE", erro: "BLOQUEADO", carta: "CARTA NA MANGA", negociado: "PRECO NEGOCIADO", kit: "KIT" }[p.veredito] || "ATENCAO",
      };
      for (const m of p.motivos) saida.push({ ...cab, Tipo: "pedido", Item: "", Motivo: m.texto });
      for (const d of p.divergentes)
        saida.push({
          ...cab, Tipo: "item", Item: `${d.codigo} ${d.nomeErp}`,
          Motivo: `${d.produto.nome}: veio ${moeda(d.unit)} (${moeda(d.bruto)} sem o desconto), esperado ${moeda(d.esperado)} (${d.pista})`,
        });
    }
    if (!saida.length) return;
    baixarCSV(`conferencia-${arquivo.name.replace(/\.[^.]+$/, "")}.csv`, saida);
  }

  const rotuloVeredito = {
    inadimplente: "Inadimplente", erro: "Bloqueado", alerta: "Atenção", carta: "Carta na Manga", kit: "Kit", liberado: "Liberado",
    negociado: "Preço negociado", bonificacao: "Bonificação",
  };

  return (
    <div className="vp">
      <style>{CSS}</style>
      <div className="vp-wrap">
        <header className="vp-topo">
          <div>
            <p className="vp-eyebrow">Under's Brothers · tabela de agosto</p>
            <h1 className="vp-titulo">Conferência comercial</h1>
            <p className="vp-sub">
              Habilitação pelos 50% de proteína, faixa pelo total em produto e preço item a item.
            </p>
          </div>
          <div style={{ textAlign: "right" }}>
            <p className="vp-eyebrow">Conferente</p>
            {nomeSalvo ? (
              <p style={{ margin: "2px 0 0", fontFamily: "var(--mono)", fontSize: 13 }}>
                {operador}{" "}
                <button className="vp-chip" style={{ marginLeft: 6 }} onClick={() => setNomeSalvo(false)}>trocar</button>
              </p>
            ) : (
              <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
                <input className="vp-input" style={{ width: 140 }} placeholder="seu nome" value={operador}
                  onChange={(e) => setOperador(e.target.value)} onKeyDown={(e) => e.key === "Enter" && salvarNome()} />
                <button className="vp-btn" onClick={salvarNome}>Salvar</button>
              </div>
            )}
          </div>
        </header>

        {falha && <div className="vp-erro-caixa">{falha}</div>}

        <section className="vp-cartao">
          <h2>Planilha de pedidos <span>dashboard · csv · xlsx</span></h2>
          <div className={`vp-solta${arrastando ? " ativo" : ""}`}
            onClick={() => inputRef.current?.click()}
            onDragOver={(e) => { e.preventDefault(); setArrastando(true); }}
            onDragLeave={() => setArrastando(false)}
            onDrop={(e) => { e.preventDefault(); setArrastando(false); receberArquivo(e.dataTransfer.files?.[0]); }}
            role="button" tabIndex={0} onKeyDown={(e) => e.key === "Enter" && inputRef.current?.click()}>
            {carregando ? <strong>Lendo a planilha…</strong>
              : arquivo ? (<>
                  <strong style={{ fontFamily: "var(--mono)" }}>{arquivo.name}</strong>
                  <small>{dados?.totalLinhas} linhas · {dados?.pedidos.length} pedidos · clique para trocar</small>
                </>)
              : (<><strong>Arraste o Dashboard aqui</strong><small>ou clique para escolher no computador</small></>)}
          </div>
        </section>
        <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv,.txt" style={{ display: "none" }}
          onChange={(e) => receberArquivo(e.target.files?.[0])} />

        <section className="vp-cartao">
          <h2>Base de títulos <span>detalhamento · abertos · csv · xlsx</span></h2>
          <div className="vp-solta" onClick={() => inputTitRef.current?.click()}
            onDragOver={(e) => e.preventDefault()}
            onDrop={(e) => { e.preventDefault(); receberTitulos(e.dataTransfer.files?.[0]); }}
            role="button" tabIndex={0} onKeyDown={(e) => e.key === "Enter" && inputTitRef.current?.click()}>
            {carregandoTit ? <strong>Lendo a base…</strong>
              : titulos ? (<>
                  <strong style={{ fontFamily: "var(--mono)" }}>{arquivoTit?.name}</strong>
                  <small>
                    {titulos.vencidos} títulos vencidos · {titulos.clientes} clientes inadimplentes
                    {" "}· clique para trocar
                  </small>
                </>)
              : (<><strong>Arraste a Base de Títulos aqui</strong>
                  <small>opcional — sem ela o validador não checa inadimplência</small></>)}
          </div>
          {bruto && !bruto.temCnpj && (
            <p className="vp-aviso" style={{ color: "var(--bloq)" }}>
              A planilha de pedidos não trouxe a coluna Cnpj Cliente, então não dá para cruzar com os títulos.
            </p>
          )}
        </section>
        <input ref={inputTitRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }}
          onChange={(e) => receberTitulos(e.target.files?.[0])} />

        {dados && (
          <>
            <section className="vp-recibo">
              <div className="vp-recibo-topo">
                <span>{arquivo?.name}</span>
                <span>{operador || "sem nome"} · {agora()}</span>
              </div>
              <div className="vp-chips" style={{ marginTop: 10 }}>
                {[["comercial", "Em análise comercial"], ["financeiro", "Aguardando financeiro"], ["todos", "Todos os pedidos"]]
                  .map(([v, r]) => (
                    <button key={v} className="vp-chip" aria-pressed={fila === v} onClick={() => setFila(v)}>{r}</button>
                  ))}
              </div>
              <div className="vp-tally">
                <div><b style={{ color: "#6B0F0A" }}>{contagem.inadimplente}</b><span style={{ color: "#6B0F0A" }}>Inadimplentes</span></div>
                <div><b style={{ color: "var(--bloq)" }}>{contagem.erro}</b><span style={{ color: "var(--bloq)" }}>Bloqueados</span></div>
                <div><b style={{ color: "var(--aten)" }}>{contagem.alerta}</b><span style={{ color: "var(--aten)" }}>Atenção</span></div>
                <div><b style={{ color: "var(--azul)" }}>{contagem.carta}</b><span style={{ color: "var(--azul)" }}>Carta na manga</span></div>
                <div><b style={{ color: "#5B3C88" }}>{contagem.kit}</b><span style={{ color: "#5B3C88" }}>Kit</span></div>
                <div><b style={{ color: "var(--ok)" }}>{contagem.liberado}</b><span style={{ color: "var(--ok)" }}>Liberados</span></div>
                <div><b style={{ color: "var(--aten)" }}>{contagem.negociado}</b><span style={{ color: "var(--aten)" }}>Negociado</span></div>
                <div><b style={{ color: "var(--fraca)" }}>{contagem.bonificacao}</b><span style={{ color: "var(--fraca)" }}>Bonific.</span></div>
              </div>
              <p className="vp-aviso" style={{ marginTop: 4 }}>
                Liberados inclui os que passaram com ressalva, então os números se
                sobrepõem e somam mais que o total de pedidos.
              </p>
              <div className="vp-serrilha" />
              <button className="vp-btn vp-btn-linha" onClick={exportar}
                disabled={contagem.erro + contagem.alerta + contagem.carta + contagem.inadimplente === 0}>
                Baixar pendências em CSV
              </button>
            </section>

            {visiveis.length === 0 ? (
              <p className="vp-vazio">Nenhum pedido nesta fila.</p>
            ) : (
              visiveis.map((p, ix) => {
                const aberto = abertos.has(p.id);
                const colado = ix > 0 && visiveis[ix - 1].grupo === p.grupo;
                return (
                  <article key={p.id} className={`vp-ped ${p.veredito}${colado ? " colado" : ""}`}>
                    <div className="vp-ped-topo" onClick={() => alternar(p.id)} role="button" tabIndex={0}
                      onKeyDown={(e) => e.key === "Enter" && alternar(p.id)}>
                      <span className="vp-ped-id">
                        {colado ? <span className="vp-elo">↳</span> : null}
                        {p.id}
                        {p.mercos ? <span className="vp-mercos">/{p.mercos}</span> : null}
                      </span>
                      <span className="vp-ped-data">{p.data || "sem data"}</span>
                      <span className="vp-ped-cli">{p.cliente}</span>
                      {p.doc ? <span className="vp-ped-doc">{p.doc}</span> : null}
                      {p.nfsCliente === 1 ? (
                        <span className="vp-selo novo" title="uma nota fiscal emitida na base">
                          cliente novo
                        </span>
                      ) : p.nfsCliente != null && p.nfsCliente > 1 ? (
                        <span className="vp-selo pedidos" title="notas fiscais emitidas na base">
                          {p.nfsCliente} pedidos
                        </span>
                      ) : p.nfsCliente === 0 ? (
                        <span className="vp-selo novo" title="nenhuma nota fiscal na base">
                          primeira compra
                        </span>
                      ) : null}
                      {p.passivo && p.passivo.valor > 0 ? (
                        <span
                          className="vp-selo aberto"
                          title={`${p.passivo.titulos} título(s) em aberto`}
                        >
                          em aberto {moeda(p.passivo.valor)}
                        </span>
                      ) : null}
                      {p.observacoes ? <span className="vp-selo obs">obs.</span> : null}
                      {p.pedidos && p.pedidos.length > 1 && (
                        <span className="vp-selo alerta">
                          com {p.pedidos.filter((x) => x !== p.id).join(", ")}
                        </span>
                      )}
                      {(() => {
                        // pedido que não foi barrado carrega o selo verde; a
                        // ressalva aparece ao lado, sem esconder a aprovação
                        const barrado = ["erro", "inadimplente", "negociado", "bonificacao"];
                        if (barrado.includes(p.veredito))
                          return <span className={`vp-selo ${p.veredito}`}>{rotuloVeredito[p.veredito]}</span>;
                        return (
                          <>
                            <span className="vp-selo liberado">Liberado</span>
                            {p.veredito !== "liberado" && (
                              <span className={`vp-selo ${p.veredito}`}>{rotuloVeredito[p.veredito]}</span>
                            )}
                          </>
                        );
                      })()}
                      <span style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--fraca)" }}>
                        {aberto ? "▾" : "▸"}
                      </span>
                    </div>
                    <div className="vp-metricas">
                      {p.tipo === "bonificacao" ? (
                        <span>bonificação <b>{moeda(p.totalBonificado)}</b></span>
                      ) : (
                        <>
                          <span>
                            este pedido <b>{moeda(p.total)}</b>
                            {p.total !== p.totalBruto ? ` (tabela ${moeda(p.totalBruto)})` : ""}
                            {p.pedidos.length > 1
                              ? ` · soma dos ${p.pedidos.length} pedidos ${moeda(p.neg.total)}`
                              : ""}
                          </span>
                          <span>
                            proteína <b>{(p.fatia * 100).toFixed(1)}%</b>
                            <span className="vp-barrinha">
                              <i style={{
                                width: `${Math.min(p.fatia * 100, 100)}%`,
                                background: !p.habilitado
                                  ? "var(--bloq)"
                                  : p.fatia > p.regime.limite
                                  ? "var(--aten)"
                                  : "var(--ok)",
                              }} />
                            </span>
                            <span style={{ marginLeft: 5 }}>
                              /{(p.neg.teto * 100).toFixed(0)}%
                            </span>
                          </span>
                          <span>faixa <b>{p.faixa ? p.faixa.rotulo + (p.faixa.tolerada ? " ~" : "") : "—"}</b></span>
                          {p.margem && p.margem.faturamento > 0 && (
                            <span>
                              MC{" "}
                              <b
                                style={{
                                  color:
                                    p.margem.pct >= MC_META
                                      ? "var(--ok)"
                                      : p.margem.pct >= MC_DIRETORIA
                                      ? "var(--aten)"
                                      : "var(--bloq)",
                                }}
                              >
                                {(p.margem.pct * 100).toFixed(1)}%
                              </b>
                              <span className="vp-barrinha" title="meta 30%">
                                <i
                                  style={{
                                    width: `${Math.max(0, Math.min(p.margem.pct / 0.5, 1)) * 100}%`,
                                    background:
                                      p.margem.pct >= MC_META
                                        ? "var(--ok)"
                                        : p.margem.pct >= MC_DIRETORIA
                                        ? "var(--aten)"
                                        : "var(--bloq)",
                                  }}
                                />
                              </span>
                            </span>
                          )}
                          <span>{p.tipo === "campanha" ? "preço de campanha" : p.tipo === "misto" ? `${p.naTabela}/${p.neg.itens} na campanha` : "preço negociado"}</span>
                        </>
                      )}
                      <span>{p.pagto ? p.pagto.nome : "—"} · {p.condPgto || "—"}</span>
                      {p.representante ? <span>rep. <b>{p.representante}</b></span> : null}
                    </div>

                    {aberto && (
                      <div className="vp-corpo">
                        {p.passivo && p.passivo.valor > 0 && (
                          <div className="vp-obs" style={{ borderLeftColor: "var(--aten)", background: "var(--atenf)" }}>
                            <span style={{ color: "var(--aten)" }}>valores em aberto</span>
                            {`${p.cliente} tem ${moeda(p.passivo.valor)} em ${p.passivo.titulos} `}
                            {p.passivo.titulos === 1 ? "título em aberto" : "títulos em aberto"}
                            {p.debito
                              ? `, dos quais ${moeda(p.debito.valor)} já vencidos`
                              : " (nenhum vencido)"}
                          </div>
                        )}
                        {p.observacoes && (
                          <div className="vp-obs">
                            <span>observação do representante</span>
                            {p.observacoes}
                          </div>
                        )}
                        {p.margem && p.margem.faturamento > 0 && (
                          <div className="vp-mc">
                            <div className="vp-mc-linhas">
                              <span>faturado <b>{moeda(p.margem.faturamento)}</b></span>
                              <span>líquido s/ ICMS <b>{moeda(p.margem.liquida)}</b></span>
                              <span>custo <b>{moeda(p.margem.custo)}</b></span>
                              <span>
                                deduções <b>{moeda(p.margem.deducoes)}</b>
                                {" "}({((p.margem.deducoes / p.margem.faturamento) * 100).toFixed(1)}%)
                              </span>
                              <span>
                                ICMS <b>{(p.margem.aliquota * 100).toFixed(0)}%</b> · CD {p.margem.cd}
                                {" "}· {p.margem.condicoes.join(" / ")}
                                {" "}· custo financeiro{" "}
                                <b>{(p.margem.pctFinanceiro * 100).toFixed(1)}%</b>
                              </span>
                              <span>
                                MC{" "}
                                <b style={{ color: p.margem.pct >= MC_META ? "var(--ok)" : p.margem.pct >= MC_DIRETORIA ? "var(--aten)" : "var(--bloq)" }}>
                                  {moeda(p.margem.mc)} · {(p.margem.pct * 100).toFixed(1)}%
                                </b>
                              </span>
                            </div>
                            {(() => {
                              const vistos = new Set();
                              const distintos = p.margem.porItem.filter((d) => {
                                if (vistos.has(d.produto.nome)) return false;
                                vistos.add(d.produto.nome);
                                return true;
                              });
                              if (distintos.length < 2) return null;
                              return (
                                <div className="vp-mc-itens">
                                  menor margem:{" "}
                                  {distintos.slice(0, 3).map((d, i) => (
                                    <span key={i}>
                                      {d.produto.nome} <b>{(d.mcPctItem * 100).toFixed(0)}%</b>
                                      {i < Math.min(2, distintos.length - 1) ? " · " : ""}
                                    </span>
                                  ))}
                                </div>
                              );
                            })()}
                          </div>
                        )}
                        {p.validos && p.validos.length > 0 && (
                          <table className="vp-tab" style={{ marginBottom: 12 }}>
                            <thead>
                              <tr>
                                <th>SKU</th><th>Produto</th>
                                <th style={{ textAlign: "right" }}>Qtd.</th>
                                <th style={{ textAlign: "right" }}>Unit.</th>
                                <th style={{ textAlign: "right" }}>s/ desc.</th>
                                <th style={{ textAlign: "right" }}>Total</th>
                              </tr>
                            </thead>
                            <tbody>
                              {p.validos.map((i, ix) => (
                                <tr key={ix}>
                                  <td>{i.codigo}</td>
                                  <td>{i.produto ? i.produto.nome : i.nomeErp}</td>
                                  <td className="num">{i.qtde}</td>
                                  <td className="num">{moeda(i.unit)}</td>
                                  <td className="num">
                                    {i.bruto !== i.unit ? moeda(i.bruto) : "—"}
                                  </td>
                                  <td className="num">{moeda(i.total)}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        )}

                        {p.motivos.length > 0 && (
                          <ul className="vp-motivos">
                            {p.motivos.map((m, i) => (<li key={i} className={m.nivel}>{m.texto}</li>))}
                          </ul>
                        )}
                        {p.divergentes.length > 0 && (
                          <table className="vp-tab">
                            <thead>
                              <tr>
                                <th>SKU</th><th>Produto</th>
                                <th style={{ textAlign: "right" }}>Veio → s/ desc.</th>
                                <th style={{ textAlign: "right" }}>Esperado</th>
                                <th style={{ textAlign: "right" }}>Dif.</th>
                                <th>Observação</th>
                              </tr>
                            </thead>
                            <tbody>
                              {p.divergentes.map((d, i) => (
                                <tr key={i}>
                                  <td>{d.codigo}</td>
                                  <td>{d.produto.nome}</td>
                                  <td className="num">{moeda(d.unit)}{d.bruto !== d.unit ? <span style={{ color: "var(--fraca)" }}> → {moeda(d.bruto)}</span> : null}</td>
                                  <td className="num">{d.dif == null ? "—" : moeda(d.esperado)}</td>
                                  <td className="num" style={{ color: d.nivel === "erro" ? "var(--bloq)" : d.nivel === "carta" ? "var(--azul)" : "var(--aten)" }}>
                                    {d.dif == null ? "—" : `${d.dif > 0 ? "+" : ""}${d.dif.toFixed(2).replace(".", ",")}`}
                                  </td>
                                  <td>{d.pista}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        )}
                        {p.motivos.length === 0 && p.divergentes.length === 0 && (
                          <p style={{ margin: 0, fontSize: 13, color: "var(--fraca)" }}>
                            Nada a apontar: habilitado, dentro da faixa e com todos os preços corretos.
                          </p>
                        )}
                      </div>
                    )}
                  </article>
                );
              })
            )}
          </>
        )}

        {/* O histórico continua sendo gravado a cada conferência, mas fica
            fora da tela — abre só quando alguém pede */}
        <p style={{ marginTop: 18, textAlign: "center" }}>
          <button className="vp-chip" onClick={() => setVerHistorico((v) => !v)}>
            {verHistorico ? "ocultar conferências recentes" : "ver conferências recentes"}
          </button>
        </p>

        {verHistorico && (
          <section className="vp-cartao">
            <h2>Conferências recentes <span>compartilhado</span></h2>
            {historico.length === 0 ? (
              <p className="vp-aviso">Nenhuma conferência registrada ainda.</p>
            ) : (
              <ul className="vp-hist">
                {historico.map((h, i) => (
                  <li key={i}>
                    <span style={{ color: "var(--fraca)" }}>{h.quando}</span>
                    <span className="arq">{h.arquivo}</span>
                    <span>{h.quem}</span>
                    <span style={{ color: "var(--bloq)" }}>{h.bloqueados} bloq.</span>
                    <span style={{ color: "var(--aten)" }}>{h.atencao} aten.</span>
                    <span style={{ color: "var(--fraca)" }}>de {h.pedidos}</span>
                  </li>
                ))}
              </ul>
            )}
            <p className="vp-aviso">
              Visível para todos que abrirem este artefato. A planilha não é enviada a lugar
              nenhum — só nome do arquivo, data e totais.
            </p>
          </section>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(<ValidadorPedidos />);
</script></body></html>
