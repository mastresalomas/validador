   Passou R$ 1,00 do teto, o pedido já usa a coluna seguinte:
   R$ 20.001 é pedido da faixa R$ 30.000. */
const FAIXAS = [
  { teto: 5000, rotulo: "R$ 5.000", curto: "5K" },
  { teto: 10000, rotulo: "R$ 10.000", curto: "10K" },

const TOLERANCIA = 0.02; // 2% para baixo no piso da faixa
const TOLERANCIA_PROTEINA = 0.03; // 3 pontos percentuais sobre o limite vigente

/* Limite de proteína por período, lido pela DATA DO PEDIDO.
   Assim um pedido de agosto continua sendo julgado pela regra de agosto

   Para encerrar ou prorrogar a campanha, mexa só aqui. */
const LIMITE_PADRAO = 0.5;
const VIGENCIAS = [
  { de: "2026-08-01", ate: "2026-09-30", limite: 0.7, nome: "exceção de agosto e setembro" },

function paraData(txt) {
  const m = String(txt ?? "").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if (!m) return null;
  return Number(m[3] + m[2] + m[1]);
}
const chaveData = (iso) => Number(iso.replace(/-/g, ""));

/* a condição comercial vale para o mês inteiro do cliente */
const mesDe = (txt) => {
  const m = String(txt ?? "").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? `${m[2]}/${m[3]}` : "sem data";
};

function regimeProteina(dataPedido) {
  const d = paraData(dataPedido);
  const v = d && VIGENCIAS.find((x) => d >= chaveData(x.de) && d <= chaveData(x.ate));
  const limite = v ? v.limite : LIMITE_PADRAO;
  return {
    limite,
    teto: limite + TOLERANCIA_PROTEINA,
    nome: v ? v.nome : "regra padrão",
    excecao: !!v,
    semData: !d,
  };
}

/* Contam como proteína no limite de 50%. O resto do catálogo é mix. */
const PROTEINAS = new Set([
  "100% WHEY CRUSH",
  "PROTEIN CRUSH 450G",
  "PROTEIN CRUSH 900G",
  "BEEF PROTEIN CRUSH",
]);

/* Bonificação por faixa — percentual sobre o total de mix.
   PENDENTE: assim que a tabela chegar, preencher aqui na mesma ordem das FAIXAS. */
const BONIFICACAO_POR_FAIXA = null; // ex.: [0.03, 0.035, 0.04, 0.045, 0.05, 0.055, 0.06]

/* ============================================================
   DE-PARA: SKU do ERP -> produto da campanha
   O nome no ERP traz sabor e gramatura ("100% WHEY CRUSH
   CONCENTRADA 900G CHOCOBEAR"), então o casamento é por padrão.
   ============================================================ */
function normalizar(txt) {
  return String(txt ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g, " ")
    .trim();
}

const CACHE_MAPA = new Map();

function mapearProduto(codigo, produto) {
  const cod = String(codigo ?? "").trim().toUpperCase();
  const chave = cod + "|" + produto;
  if (CACHE_MAPA.has(chave)) return CACHE_MAPA.get(chave);
  const r = calcularMapa(cod, produto);
  CACHE_MAPA.set(chave, r);
  return r;
}

function calcularMapa(cod, produto) {
  if (cod.startsWith("ACE")) return { produto: null, familia: "vestuário/acessório" };
  if (cod.startsWith("EMB")) return { produto: null, familia: "embalagem" };
  const n = normalizar(produto);
  const tem = (...ps) => ps.every((p) => n.includes(p));
  const ok = (nome) => ({ produto: TABELA[nome] || null, familia: "produto" });

  if (tem("ISO HYDRO CLINICAL") || tem("ISOHYDRO", "CLINICAL")) return ok("ISO HYDRO CLINICAL 450G");
  if (tem("ISOHYDRO") || tem("ISO HYDRO")) return ok("ISO HYDRO CRUSH");
  if (tem("100 WHEY CRUSH")) return ok("100% WHEY CRUSH");
  if (tem("BEEF PROTEIN")) return ok("BEEF PROTEIN CRUSH");
  if (tem("PROTEIN CRUSH")) {
    if (n.includes("900")) return ok("PROTEIN CRUSH 900G");
    if (n.includes("450")) return ok("PROTEIN CRUSH 450G");
    return { produto: null, familia: "produto" };
  }
  if (tem("CAPTAIN GAINER")) return ok("CAPTAIN GAINER");
  if (tem("WARZONE ROCKET")) return ok("WARZONE ROCKET ENERGY");
  if (tem("WARZONE NIGHT")) return ok("WARZONE NIGHT BATTLE");
  if (tem("DISPLAY", "FCKNG")) return ok("DISPLAY FCKNG BOOSTER");
  if (tem("FCKNG BOOSTER")) {
    if (n.includes("600")) return ok("FCKNG BOOSTER 600G");
    if (n.includes("300")) return ok("FCKNG BOOSTER 300G");
    return { produto: null, familia: "produto" };
  }
  if (tem("BUENISSIMO")) return ok("BAKED BAR - BUENISSIMO");
  if (tem("BETA ALANINE")) return ok("BETA ALANINE 300G");
  if (tem("TESTO CYCLE")) return ok("TESTO CYCLE");
  if (tem("CARNITINE")) return ok("X-CARNITINE");
  if (tem("GLUTAMINA")) return ok("GLUTAMINA 300G");
  if (tem("CREATINE")) {
    if (n.includes("150")) return ok("CREATINE 150G");
    if (n.includes("500")) return ok("CREATINE 500G");
    if (n.includes("300"))
      return n.includes("BORNTODISRUPT") ? ok("CREATINE 300G") : ok("CREATINE SABOR 300G");
    return { produto: null, familia: "produto" };
  }
  if (tem("DIMETHYLEX")) {
    if (n.includes("STIM FREE")) return ok("DIMETHYLEX STIM FREE");
    if (n.includes("TIME RELEASE")) return ok("DIMETHYLEX TIME RELEASE");
    return ok("DIMETHYLEX");
  }
  if (tem("MULTIVITAMINICO")) return ok("MULTIVITAMINICO 90 CAPS");
  if (tem("OMEGA")) {
    if (n.includes("120")) return ok("OMEGA ULTRA 120 CAPS");
    if (n.includes("60")) return ok("OMEGA ULTRA 60 CAPS");
    return { produto: null, familia: "produto" };
  }
  if (tem("COQ")) return ok("COQ-10 60 CAPS");
  if (tem("CAFEINA")) return ok("CAFEINA 60 CAPS");
  if (tem("OSTEO")) return ok("OSTEO REPAIR 60 CAPS");
  if (tem("MAGNESIO")) return ok("MAGNESIO INOSITOL 300G");
  if (tem("RAMPAGE")) return ok("RAMPAGE 300G");
  if (tem("CLEMBUTER")) return ok("CLEMBUTER UNDER");
  return { produto: null, familia: "produto" };
}

/* ============================ utilitários ============================ */
function paraNumero(bruto) {
  if (typeof bruto === "number") return bruto;
  let t = String(bruto ?? "").trim();
  if (!t) return null;
  t = t.replace(/R\$/gi, "").replace(/\s/g, "");
  const v = t.includes(","), p = t.includes(".");
  if (v && p) t = t.replace(/\./g, "").replace(",", ".");
  else if (v) t = t.replace(",", ".");
  else if (p && !/\.\d{1,2}$/.test(t)) t = t.replace(/\./g, "");
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

const moeda = (n) =>
  n == null ? "—" : n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

function faixaDe(total) {
  if (total == null || total <= 0) return null;
  // conta quantos tetos o pedido ultrapassou (com 2% de tolerância)
  let degraus = 0;
  FAIXAS.forEach((f) => {
    if (total >= f.teto * (1 - TOLERANCIA)) degraus += 1;
  });
  const indice = Math.min(degraus, FAIXAS.length - 1);
  const ultimo = degraus > 0 ? FAIXAS[degraus - 1] : null; // o teto que ele passou
  return {
    ...FAIXAS[indice],
    indice,
    tolerada: !!ultimo && total < ultimo.teto,
    falta: ultimo ? Number((ultimo.teto - total).toFixed(2)) : 0,
    noTopo: indice >= FAIXAS.length - 1,
    carta: indice < FAIXAS.length - 1 ? { ...FAIXAS[indice + 1], indice: indice + 1 } : null,
  };
}

/* Catálogo por vigência. Setembro repetiu exatamente os preços de agosto e
   apenas retirou quatro produtos. Se algum mês trouxer preço diferente,
   duplicar o bloco de preços em vez de reaproveitar. */
const FORA_EM_SETEMBRO = [
  "ISO HYDRO CRUSH",
  "CLEMBUTER UNDER",
  "DIMETHYLEX TIME RELEASE",
  "DISPLAY FCKNG BOOSTER",
];

const CATALOGOS = [
  { de: "2026-09-01", ate: "2026-09-30", fora: FORA_EM_SETEMBRO, nome: "setembro" },
];

function catalogoDe(dataPedido) {
  const d = paraData(dataPedido);
  const c = d && CATALOGOS.find((x) => d >= chaveData(x.de) && d <= chaveData(x.ate));
  return {
    nome: c ? c.nome : "agosto",
    fora: new Set(c ? c.fora : []),
  };
}

/* ---------- condição especial de volume em creatina ----------
   Preço por compromisso de volume, com piso de fechamento. Nesses itens
   o à vista cai para 3% e o cartão não dá desconto adicional. */
const VOLUME_CREATINA = {
  de: "2026-09-01", ate: "2026-09-30",
  descontoVista: 0.03,
  descontoCartao: 0,
  degraus: [
    { rotulo: "500 un", compromisso: 500, minimo: 250, precos: { "CREATINE 300G": 26.41, "CREATINE SABOR 300G": 29.87 } },
    { rotulo: "250 un", compromisso: 250, minimo: 120, precos: { "CREATINE 300G": 27.9, "CREATINE SABOR 300G": 31.55 } },
    { rotulo: "250 un", compromisso: 250, minimo: 120, precos: { "CREATINE 500G": 39.9 } },
    { rotulo: "120 un", compromisso: 120, minimo: 60, precos: { "CREATINE 500G": 44.9 } },
    { rotulo: "200 un", compromisso: 200, minimo: 80, precos: { "CREATINE 150G": 14.9 } },
    { rotulo: "80 un", compromisso: 80, minimo: 40, precos: { "CREATINE 150G": 17.9 } },
  ],
};

const dentroDaVigencia = (data, faixa) => {
  const d = paraData(data);
  return !!d && d >= chaveData(faixa.de) && d <= chaveData(faixa.ate);
};

/* Soma a quantidade de cada produto da campanha na negociação inteira */
function somarPorProduto(validos) {
  const m = new Map();
  for (const i of validos) {
    if (!i.produto) continue;
    m.set(i.produto.nome, (m.get(i.produto.nome) || 0) + (i.qtde || 0));
  }
  return m;
}

/* Um item entra na condição de volume quando o preço bate com algum degrau.
   Nesses itens o desconto de pagamento é diferente: 3% à vista, 0% no cartão. */
function acharDegrauVolume(item, data) {
  if (!item.produto || item.unit == null) return null;
  if (!dentroDaVigencia(data, VOLUME_CREATINA)) return null;
  const cond = String(item.condPgtoBruto ?? "");
  const desc = /VISTA/i.test(cond)
    ? VOLUME_CREATINA.descontoVista
    : /CART[AÃ]O/i.test(cond)
    ? VOLUME_CREATINA.descontoCartao
    : 0;
  for (const d of VOLUME_CREATINA.degraus) {
    const alvo = d.precos[item.produto.nome];
    if (alvo == null) continue;
    if (Math.abs(item.unit - alvo * (1 - desc)) <= 0.03) return { degrau: d, alvo, desc };
  }
  return null;
}

function conferirVolumeCreatina(validos, data, motivos, explicados) {
  const achados = [];
  for (const i of validos) {
    if (explicados.has(i)) continue; // já atribuído a um kit
    const r = acharDegrauVolume(i, data);
    if (r) { achados.push({ item: i, ...r }); explicados.add(i); }
  }
  if (!achados.length) return;

  const somas = somarPorProduto(validos);
  // creatina 300g pura e com sabor contam juntas no volume
  const soma300 = (somas.get("CREATINE 300G") || 0) + (somas.get("CREATINE SABOR 300G") || 0);

  const porDegrau = new Map();
  for (const a of achados) {
    if (!porDegrau.has(a.degrau)) porDegrau.set(a.degrau, []);
    porDegrau.get(a.degrau).push(a);
  }

  for (const [degrau, itens] of porDegrau) {
    const nomes = Object.keys(degrau.precos);
    const ehTrezentos = nomes.includes("CREATINE 300G");
    const qtde = ehTrezentos ? soma300 : nomes.reduce((s, n) => s + (somas.get(n) || 0), 0);
    const rotulo = ehTrezentos ? "creatina 300g (pura + sabor)" : nomes.join(" + ").toLowerCase();

    if (qtde < degrau.minimo) {
      motivos.push({
        nivel: "erro",
        texto:
          `Condição de volume em creatina: preço do degrau de ${degrau.rotulo} aplicado, mas o pedido ` +
          `tem só ${qtde} un de ${rotulo}. O piso para fechar esse preço é ${degrau.minimo} un`,
      });
    } else if (qtde < degrau.compromisso) {
      motivos.push({
        nivel: "alerta",
        texto:
          `Condição de volume em creatina: ${qtde} un de ${rotulo}, abaixo do compromisso de ` +
          `${degrau.compromisso} un mas dentro do piso de ${degrau.minimo} un — preço permitido`,
      });
    } else {
      motivos.push({
        nivel: "info",
        texto: `Condição de volume em creatina: ${qtde} un de ${rotulo}, compromisso de ${degrau.compromisso} un cumprido`,
      });
    }
    if (itens.some((a) => a.desc > 0)) {
      motivos.push({
        nivel: "info",
        texto: "Itens da condição de volume: à vista vale 3%, cartão não dá desconto adicional e não geram bonificação",
      });
    }
  }
}

/* Degrau devido conforme a quantidade do próprio produto na negociação */
function degrauPorQuantidade(nomeProduto, qtde) {
  const degraus = CAMPANHA_PROTEINA.produtos[nomeProduto];
  if (!degraus) return null;
  let achado = null;
  for (const d of degraus) if (qtde >= d.qtde) achado = d;
  return achado;
}

/* Pedido só de proteína: o preço não vem da tabela por faixa, e sim da
   campanha de proteína, no degrau correspondente à quantidade comprada. */
function conferirSoProteina(validos, neg, data, motivos, divergentes, explicados) {
  for (const i of validos) {
    if (!i.produto || i.bruto == null) continue;
    explicados.add(i);
    const qtde = neg.somas.get(i.produto.nome) || 0;
    const degrau = degrauPorQuantidade(i.produto.nome, qtde);

    if (!degrau) {
      motivos.push({
        nivel: "alerta",
        texto:
          `${i.produto.nome}: ${qtde} un na negociação, abaixo das ` +
          `${CAMPANHA_PROTEINA.produtos[i.produto.nome][0].qtde} un do primeiro degrau da campanha`,
      });
      continue;
    }

    const bate =
      Math.abs(i.bruto - degrau.preco) <= 0.03 ||
      (degrau.alternativo != null && Math.abs(i.bruto - degrau.alternativo) <= 0.03);
    if (bate) {
      if (degrau.alternativo != null && Math.abs(i.bruto - degrau.alternativo) <= 0.03) {
        motivos.push({
          nivel: "alerta",
          texto:
            `${i.produto.nome} a ${moeda(degrau.alternativo)}, que é o valor do percentual ` +
            `impresso. A tabela da campanha traz ${moeda(degrau.preco)}`,
        });
      }
      continue;
    }

    // preço fora do degrau: abaixo prejudica a empresa, acima é negociação
    const outro = (CAMPANHA_PROTEINA.produtos[i.produto.nome] || []).find(
      (d) => Math.abs(i.bruto - d.preco) <= 0.03
    );
    const dif = Number((i.bruto - degrau.preco).toFixed(2));
    divergentes.push({
      ...i,
      esperado: degrau.preco,
      dif,
      faixaOutra: -1,
      pista: outro
        ? `preço do degrau de ${outro.qtde} un, mas a negociação tem ${qtde} un`
        : "fora da tabela da campanha de proteína",
      nivel: dif < 0 ? "erro" : "info",
    });
  }

  motivos.push({
    nivel: "info",
    texto:
      `${CAMPANHA_PROTEINA.nome}: pedido só de proteína, conferido pela tabela da campanha ` +
      `(24 / 48 / 96 un por produto). O teto de proteína não se aplica`,
  });
}

/* Kit fechado (1 para 1): o número firme é o preço do PAR, não a divisão entre
   os itens. O material cita percentuais que somam R$ 109,97, sete centavos
   acima do kit, então qualquer divisão que feche o par é aceita. */
function conferirKitProporcional(kit, validos, somas, motivos, explicados) {
  const nota = (nivel, texto) => motivos.push({ nivel, texto, kit: true });
  const porProduto = kit.itens.map((k) =>
    validos.filter((i) => i.produto && i.produto.nome === k.produto && i.bruto != null)
  );
  if (porProduto.some((lista) => !lista.length)) return false;

  // O Kit Beef+Creatina tem desconto próprio (10% à vista, 5% cartão), diferente
  // do padrão 8%/3%. Refaço o bruto de cada item com o desconto do kit, senão o
  // par de R$ 109,90 não fecharia em pedido à vista ou cartão.
  const brutoKit = (i) => {
    const d = CONDICOES_KIT[i.pagto.rotulo];
    return d != null ? Number((i.unit / (1 - d)).toFixed(2)) : i.bruto;
  };

  // preço unitário médio de cada produto, ponderado pela quantidade
  const medio = porProduto.map((lista) => {
    const q = lista.reduce((s, i) => s + (i.qtde || 0), 0);
    return q ? lista.reduce((s, i) => s + brutoKit(i) * (i.qtde || 0), 0) / q : brutoKit(lista[0]);
  });
  const par = Number(medio.reduce((s, v) => s + v, 0).toFixed(2));
  if (Math.abs(par - kit.parPreco) > 0.5) return false; // não é este kit

  porProduto.flat().forEach((i) => explicados.add(i));
  const qtdes = kit.itens.map((k) => somas.get(k.produto) || 0);
  const minimo = kit.itens[0].qtde;

  if (!qtdes.every((q) => q === qtdes[0])) {
    nota("alerta",
      `${kit.nome}: as quantidades não fecham em pares — ` +
      kit.itens.map((k, ix) => `${k.produto} ${qtdes[ix]} un`).join(", ") +
      ". O kit é um para um e os itens não podem ser trocados");
    return true;
  }
  if (Math.abs(par - kit.parPreco) > 0.03) {
    // o par alternativo (soma dos percentuais impressos) também é aceito
    if (kit.parAlternativo != null && Math.abs(par - kit.parAlternativo) <= 0.03) {
      nota("info",
        `${kit.nome}: ${qtdes[0]} kits a ${moeda(par)} o par (valor dos percentuais ` +
        `impressos; o material também cita ${moeda(kit.parPreco)}), composição conferida`);
      return true;
    }
    nota("erro", `${kit.nome}: o par saiu a ${moeda(par)} e deveria ser ${moeda(kit.parPreco)}`);
    return true;
  }
  if (qtdes[0] < minimo) {
    nota("alerta",
      `${kit.nome}: ${qtdes[0]} kits no pedido, abaixo do mínimo de ${minimo}. ` +
      `O preço de ${moeda(kit.parPreco)} o par vale a partir de ${minimo} kits`);
    return true;
  }
  nota("info",
    `${kit.nome}: ${qtdes[0]} kits a ${moeda(kit.parPreco)} o par, composição conferida ` +
    `(${moeda(qtdes[0] * kit.parPreco)})`);
  return true;
}

function conferirKits(validos, data, motivos, explicados, faixa) {
  const somas = somarPorProduto(validos);
  let achou = false;
  const marcar = (n) => { for (let i = n; i < motivos.length; i++) motivos[i].kit = true; };
  for (const kit of KITS) {
    if (!dentroDaVigencia(data, kit)) continue;
    if (kit.proporcional) {
      if (conferirKitProporcional(kit, validos, somas, motivos, explicados)) achou = true;
      continue;
    }
    const antes = motivos.length;
    // o kit é invocado quando algum item sai no preço dele
    const usados = validos.filter((i) => {
      if (!i.produto || i.bruto == null) return false;
      const linha = kit.itens.find((k) => k.produto === i.produto.nome);
      if (!linha) return false;
      // o Clinical Series usa os preços da coluna de R$ 200.000; se o pedido
      // já tem direito a essa faixa, o preço se explica sozinho e não é kit
      const jaCertoPelaFaixa =
        faixa && Math.abs(i.bruto - i.produto.precos[faixa.indice]) <= 0.03;
      if (jaCertoPelaFaixa) return false;
      return (
        Math.abs(i.bruto - linha.preco) <= 0.03 ||
        (linha.alternativo != null && Math.abs(i.bruto - linha.alternativo) <= 0.03)
      );
    });
    const distintos = new Set(usados.map((i) => i.produto.nome));
    // CREATINE SABOR a R$29,87 existe no kit e na condição de volume; só
    // atribuímos ao kit quando outro item do kit também aparece no preço dele
    if (distintos.size < Math.min(2, kit.itens.length)) continue;
    achou = true;
    usados.forEach((i) => explicados.add(i));

    // item cobrado pelo valor impresso no material, que diverge do oficial
    for (const i of usados) {
      const linha = kit.itens.find((k) => k.produto === i.produto.nome);
      if (linha.alternativo == null) continue;
      if (Math.abs(i.bruto - linha.alternativo) > 0.03) continue;
      const dif = (linha.alternativo - linha.preco) * (i.qtde || 0);
      motivos.push({
        nivel: "alerta",
        texto:
          `${kit.nome}: ${i.produto.nome} saiu a ${moeda(linha.alternativo)}, valor impresso no ` +
          `material. O correto é ${moeda(linha.preco)} — ${moeda(dif)} a mais no pedido`,
      });
    }

    const faltas = [];
    for (const k of kit.itens) {
      const tem = somas.get(k.produto) || 0;
      if (tem < k.qtde) faltas.push(`${k.produto}: ${tem} de ${k.qtde} un`);
    }
    if (faltas.length) {
      motivos.push({
        nivel: "alerta",
        texto:
          `${kit.nome}: preço de kit aplicado sem a composição completa. ${faltas.join("; ")}. ` +
          `O preço só vale com todos os itens nas quantidades do kit`,
      });
    } else {
      motivos.push({
        nivel: "info",
        texto:
          `${kit.nome}: composição completa conferida, preço de kit válido (${moeda(kit.total)})` +
          (kit.bonificacao
            ? `. Rende bonificação de ${kit.bonificacao.qtde} un de ` +
              `${kit.bonificacao.produto} (${moeda(kit.bonificacao.valor)}), que vem em pedido à parte`
            : ""),
      });
    }
    marcar(antes);
  }
  return achou;
}

/* Dois CDs: Norte e Nordeste saem do RN, o resto do país sai de SP */
const NORTE_NORDESTE = new Set([
  "AC", "AM", "AP", "PA", "RO", "RR", "TO",
  "AL", "BA", "CE", "MA", "PB", "PE", "PI", "RN", "SE",
]);
const SP_DOZE = new Set(["MG", "RJ", "PR", "SC", "RS"]);

function icmsDe(uf) {
  const u = String(uf ?? "").trim().toUpperCase();
  if (!u) return { cd: "SP", aliquota: 0.18, incerto: true };
  if (NORTE_NORDESTE.has(u)) return { cd: "RN", aliquota: u === "RN" ? 0.17 : 0.12 };
  if (u === "SP") return { cd: "SP", aliquota: 0.18 };
  if (SP_DOZE.has(u)) return { cd: "SP", aliquota: 0.12 };
  return { cd: "SP", aliquota: 0.07 };
}

const DEDUCOES = { comissao: 0.07, frete: 0.031, pis: 0, financeiro: 0.045 };
const MC_META = 0.3;      // a partir daqui, aprovado
const MC_DIRETORIA = 0.25; // entre 25% e 30%, analisar

/* MC sobre o faturamento: o que sobra depois das deduções e do custo */
function margemDe(itens, uf) {
  const { cd, aliquota, incerto } = icmsDe(uf);
  let faturamento = 0, comCusto = 0, custo = 0, financeiro = 0;
  const porItem = [];
  for (const i of itens) {
    faturamento += i.total;
    const c = i.produto ? CUSTOS[i.produto.nome] : null;
    // o custo financeiro vem da própria condição de pagamento da linha
    const fin = i.pagto.financeiro;
    financeiro += i.total * fin;
    if (c == null) continue;
    comCusto += i.total;
    const cItem = c * (i.qtde || 0);
    custo += cItem;
    const ded = i.total * (DEDUCOES.comissao + DEDUCOES.frete + aliquota + fin + DEDUCOES.pis);
    const mcItem = i.total - ded - cItem;
    const liqItem = i.total * (1 - aliquota);
    porItem.push({ ...i, custoItem: cItem, mcItem, mcPctItem: liqItem > 0 ? mcItem / liqItem : 0 });
  }
  const deducoes =
    faturamento * (DEDUCOES.comissao + DEDUCOES.frete + aliquota + DEDUCOES.pis) + financeiro;
  const mc = faturamento - deducoes - custo;
  // a MC é medida sobre a receita LÍQUIDA de ICMS, não sobre o faturamento
  const liquida = faturamento * (1 - aliquota);
  const condicoes = [...new Set(itens.map((i) => i.pagto.nome))];
  return {
    cd, aliquota, incerto, faturamento, liquida, custo, deducoes, financeiro, condicoes,
    pctFinanceiro: faturamento > 0 ? financeiro / faturamento : 0,
    mc, pct: liquida > 0 ? mc / liquida : 0,
    pctSobreFaturamento: faturamento > 0 ? mc / faturamento : 0,
    cobertura: faturamento > 0 ? comCusto / faturamento : 0,
    porItem: porItem.sort((a, b) => a.mcPctItem - b.mcPctItem),
  };
}

const ehBooleano = (v, alvo) => String(v ?? "").trim().toLowerCase() === alvo;

/* O ERP já grava o preço unitário COM o desconto da condição de pagamento.
   Para comparar com a tabela da campanha é preciso desfazer esse desconto. */
/* Desconto padrão de pagamento embutido no preço do ERP: 8% à vista, 3% cartão.
   O Kit Beef + Creatina tem desconto próprio (10% / 5%) — ver CONDICOES_KIT. */
const CONDICOES = [
  // antecipado e pix são pagamento à vista: não têm custo financeiro
  { teste: /VISTA|ANTECIP|PIX/i, desconto: 0.08, financeiro: 0, rotulo: "à vista" },
  { teste: /CART[AÃ]O/i, desconto: 0.03, financeiro: 0.045, rotulo: "cartão" },
];

/* Descontos exclusivos do Kit Beef + Creatina */
const CONDICOES_KIT = {
  "à vista": 0.10,
  "cartão": 0.05,
};

function condicaoPagamento(txt) {
  const c = CONDICOES.find((x) => x.teste.test(String(txt ?? "")));
  if (!c) return { desconto: 0, financeiro: 0.045, nome: "a prazo", rotulo: "a prazo" };
  return {
    desconto: c.desconto,
    financeiro: c.financeiro,
    rotulo: c.rotulo,
    nome: `${c.rotulo} −${(c.desconto * 100).toFixed(0)}%`,
  };
}

const semDesconto = (v, desconto) =>
  v == null ? null : Number((v / (1 - desconto)).toFixed(2));

/* ============================ análise ============================ */
const ehSemVencimento = (txt) => /S\s*\/\s*(VENC|VALOR)/i.test(String(txt ?? ""));

/* Um pedido é de bonificação quando todas as suas linhas são bonificadas
   ou estão na condição sem vencimento. Ele nunca entra na soma da negociação. */
function pedidoEhBonificacao(linhas, cols) {
  return linhas.every(
    (l) => ehBooleano(l[cols.bonificado], "true") || ehSemVencimento(l[cols.condPgto])
  );
}

/* Só entram na soma da negociação os pedidos vivos: liberados, em análise ou
   faturados. Reprovado no comercial e cancelado ficam de fora. */
function pedidoEntraNaSoma(linhas, cols) {
  const lib = linhas.map((l) => String(l[cols.libComl] ?? "").trim().toLowerCase());
  if (lib.some((v) => v === "false")) return false;
  if (linhas.some((l) => normalizar(l[cols.status]).includes("CANCELADO"))) return false;
  return true;
}

function montarItens(linhas, cols) {
  const catalogo = catalogoDe(linhas[0]?.[cols.dataPedido]);
  return linhas.map((l) => {
    const codigo = String(l[cols.codigo] ?? "").trim();
    const nomeErp = String(l[cols.produto] ?? "").trim();
    const achado = mapearProduto(codigo, nomeErp);
    const familia = achado.familia;
    // produto que saiu do catálogo do mês não tem preço de campanha
    const produto = achado.produto && catalogo.fora.has(achado.produto.nome) ? null : achado.produto;
    const foraDoMes = !!achado.produto && !produto;
    // cada linha traz a própria condição de pagamento, e o desconto dela
    // já vem embutido no preço unitário gravado pelo ERP
    const pagto = condicaoPagamento(l[cols.condPgto]);
    const unit = paraNumero(l[cols.valUnit]);
    const total = paraNumero(l[cols.valTotal]) ?? 0;
    return {
      codigo, nomeErp, produto, familia, pagto, foraDoMes,
      condPgtoBruto: String(l[cols.condPgto] ?? ""),
      pedido: String(l[cols.pedido] ?? "").trim(),
      ehPA: codigo.toUpperCase().startsWith("PA"),
      bonificado: ehBooleano(l[cols.bonificado], "true"),
      qtde: paraNumero(l[cols.qtde]) ?? 0,
      unit,
      bruto: semDesconto(unit, pagto.desconto),
      total,
      totalBruto: semDesconto(total, pagto.desconto) ?? 0,
    };
  });
}

/* A condição comercial (faixa, proteína, habilitação) vale para a negociação
   inteira — a soma dos pedidos do mesmo cliente na mesma data. */
function resumirNegociacao(ids, linhas, cols) {
  const validos = montarItens(linhas, cols).filter((i) => i.ehPA && !i.bonificado);
  const total = Number(validos.reduce((s, i) => s + i.total, 0).toFixed(2));
  const totalBruto = Number(validos.reduce((s, i) => s + i.totalBruto, 0).toFixed(2));
  const proteina = Number(
    validos.filter((i) => i.produto && PROTEINAS.has(i.produto.nome))
      .reduce((s, i) => s + i.totalBruto, 0).toFixed(2)
  );
  const fatia = totalBruto > 0 ? proteina / totalBruto : 0;
  const faixa = faixaDe(totalBruto);
  const regime = regimeProteina(String(linhas[0]?.[cols.dataPedido] ?? "").trim());
  const naTabela = validos.filter(
    (i) => i.produto && i.bruto != null && i.produto.precos.some((p) => Math.abs(p - i.bruto) <= 0.03)
  ).length;
  const adesao = validos.length ? naTabela / validos.length : 0;
  // negociação só de proteína dentro da vigência: vale a campanha de proteína,
  // com preço por quantidade e sem teto de densidade
  const data = String(linhas[0]?.[cols.dataPedido] ?? "").trim();
  const somenteProteina =
    validos.length > 0 &&
    dentroDaVigencia(data, CAMPANHA_PROTEINA) &&
    validos.every((i) => i.produto && PROTEINAS.has(i.produto.nome));
  const teto = somenteProteina ? 1 : regime.teto;
  return {
    ids, total, totalBruto, proteina, somenteProteina, campanhaProteina: somenteProteina, teto,
    somas: somarPorProduto(validos),
    mix: Number((totalBruto - proteina).toFixed(2)),
    fatia, faixa, regime,
    habilitado: totalBruto > 0 && fatia <= teto + 1e-9,
    naTabela, adesao,
    tipo: adesao >= 0.8 ? "campanha" : adesao > 0 ? "misto" : "negociado",
    itens: validos.length,
  };
}

function analisarPedido(id, linhas, cols, titulos, neg, historico) {
  const cab = linhas[0];
  const valores = (col) => linhas.map((l) => String(l[col] ?? "").trim());
  const libComl = valores(cols.libComl);
  const libFin = valores(cols.libFin);
  const base = {
    id,
    pedidos: neg ? neg.ids : [id],
    cliente: String(cab[cols.cliente] ?? "").trim(),
    data: String(cab[cols.dataPedido] ?? "").trim(),
    condPgto: [...new Set(valores(cols.condPgto).filter(Boolean))].join(" / "),
    status: [...new Set(valores(cols.status).filter(Boolean))].join(" / "),
    representante: cols.representante
      ? [...new Set(valores(cols.representante).filter(Boolean))].join(" / ")
      : "",
    observacoes: cols.observacoes
      ? [...new Set(valores(cols.observacoes).filter(Boolean))].join(" | ")
      : "",
    libComl: libComl.includes("") ? "" : libComl[0],
    libFin: libFin.includes("") ? "" : libFin[0],
    linhas: linhas.length,
    cnpj: cols.cnpj ? normCnpj(cab[cols.cnpj]) : "",
    doc: cols.cnpj ? formatarDoc(cab[cols.cnpj]) : "",
    uf: cols.uf ? String(cab[cols.uf] ?? "").trim().toUpperCase() : "",
    mercos: cols.mercos ? String(cab[cols.mercos] ?? "").trim() : "",
  };
  // usado só para manter os pedidos do mesmo cliente juntos na listagem —
  // a bonificação entra aqui mesmo ficando fora da soma da negociação
  base.grupo = `${base.cnpj || base.cliente}|${mesDe(base.data)}`;

  // histórico do cliente pela quantidade de notas fiscais distintas no arquivo.
  // Agrupado por raiz de CNPJ (filiais somam). Cada NF = um pedido faturado.
  const chaveHist =
    base.cnpj && !/^0+$/.test(base.cnpj) ? base.cnpj.slice(0, 8) : normalizar(base.cliente);
  base.nfsCliente = historico && chaveHist ? historico.get(chaveHist) ?? 0 : null;

  // inadimplência reprova na entrada, antes de qualquer análise comercial.
  // procura primeiro o CNPJ exato; não achando, olha a raiz (grupo econômico)
  const exato = titulos && base.cnpj ? titulos.mapa.get(base.cnpj) || null : null;
  // a raiz só identifica grupo em CNPJ; CPF preenchido com zeros geraria
  // falso positivo entre pessoas físicas diferentes
  const ehCnpj = String(cab[cols.cnpj] ?? "").replace(/\D/g, "").length === 14;
  const grupoEc =
    !exato && ehCnpj && titulos && base.cnpj
      ? titulos.raizes.get(base.cnpj.slice(0, 8)) || null
      : null;
  const debito = exato || grupoEc;
  // passivo total em aberto do cliente (vencido + a vencer), só informativo
  const passivo =
    titulos && base.cnpj
      ? titulos.aberto?.get(base.cnpj) ||
        (ehCnpj ? titulos.abertoRaiz?.get(base.cnpj.slice(0, 8)) : null) ||
        null
      : null;
  const motivoDebito = debito
    ? {
        nivel: "erro",
        texto:
          (exato
            ? "Cliente inadimplente: "
            : `Grupo econômico inadimplente (raiz ${base.cnpj.slice(0, 8)}, ` +
              `${grupoEc.empresas.size} ${grupoEc.empresas.size === 1 ? "CNPJ" : "CNPJs"}): `) +
          `${debito.titulos} ${debito.titulos === 1 ? "título vencido" : "títulos vencidos"} ` +
          `somando ${moeda(debito.valor)}, com até ${debito.maxAtraso} dias de atraso` +
          (debito.situacoes.size ? ` (${[...debito.situacoes].join(", ")})` : ""),
      }
    : null;

  const itens = montarItens(linhas, cols);
  const bonificados = itens.filter((i) => i.bonificado);
  const validos = itens.filter((i) => i.ehPA && !i.bonificado);

  // pedido de bonificação: fica de fora da soma e é conferido à parte
  if (!validos.length) {
    return {
      ...base, itens, debito, passivo, pedidos: [id],
      tipo: "bonificacao",
      veredito: debito ? "inadimplente" : "bonificacao",
      totalBonificado: bonificados.reduce((s, i) => s + i.total, 0),
      motivos: [
        ...(motivoDebito ? [motivoDebito] : []),
        ...(BONIFICACAO_POR_FAIXA
          ? []
          : [{ nivel: "alerta", texto: "Bonificação — tabela de percentual por faixa ainda não cadastrada no validador" }]),
      ],
      divergentes: [],
    };
  }

  const total = Number(validos.reduce((s, i) => s + i.total, 0).toFixed(2));
  const totalBruto = Number(validos.reduce((s, i) => s + i.totalBruto, 0).toFixed(2));
  const pagto = { nome: [...new Set(validos.map((i) => i.pagto.nome))].join(" / ") };
  const proteina = Number(
    validos.filter((i) => i.produto && PROTEINAS.has(i.produto.nome))
      .reduce((s, i) => s + i.totalBruto, 0).toFixed(2)
  );

  // a régua comercial vem da negociação, não deste pedido isolado
  const { faixa, regime, habilitado, fatia } = neg;
  let tipo = neg.tipo;
  const irmaos = neg.ids.filter((x) => x !== id);

  const motivos = [];
  const divergentes = [];

  if (String(base.libComl).toLowerCase() === "false" || normalizar(base.status).includes("CANCELADO")) {
    motivos.push({
      nivel: "info",
      texto: "Pedido reprovado ou cancelado — não entra na soma da negociação do mês",
    });
  }

  if (irmaos.length) {
    motivos.push({
      nivel: "info",
      texto:
        `Mais de um pedido: ${neg.ids.join(", ")} do mesmo cliente em ${mesDe(base.data)}. ` +
        `A condição comercial saiu da soma dos ${neg.ids.length} pedidos do mês, ` +
        `${moeda(neg.totalBruto)}, que dá a faixa ${neg.faixa ? neg.faixa.rotulo : "—"}`,
    });
  }

  const margem = margemDe(validos, base.uf);
  const motivoMC = (() => {
    if (!margem.faturamento) return null;
    const pct = `${(margem.pct * 100).toFixed(1)}%`;
    const detalhe =
      `${moeda(margem.mc)} sobre ${moeda(margem.liquida)} de receita líquida · ICMS ` +
      `${(margem.aliquota * 100).toFixed(0)}% (CD ${margem.cd})` +
      (margem.cobertura < 0.999
        ? ` · custo conhecido de ${(margem.cobertura * 100).toFixed(0)}% do pedido`
        : "");
    if (margem.pct >= MC_META)
      return { nivel: "info", texto: `Margem de contribuição ${pct} — acima da meta de 30%. ${detalhe}` };
    if (margem.pct >= MC_DIRETORIA)
      return {
        nivel: "alerta",
        texto: `Margem de contribuição ${pct} — entre 25% e 30%, analisar. ${detalhe}`,
      };
    return {
      nivel: "erro",
      texto: `Margem de contribuição ${pct} — abaixo do piso de 25%. ${detalhe}`,
    };
  })();

  // kits e condição de volume têm preço próprio e valem mesmo quando o pedido
  // é reprovado por outro motivo — rodam antes de qualquer bifurcação
  const explicados = new Set();
  if (neg.somenteProteina)
    conferirSoProteina(validos, neg, base.data, motivos, divergentes, explicados);
  const temKit = conferirKits(validos, base.data, motivos, explicados, faixa);
  conferirVolumeCreatina(validos, base.data, motivos, explicados);
  const temCampanhaPropria = explicados.size > 0;
  // item coberto por kit, volume ou campanha de proteína tem preço próprio:
  // o pedido não é "negociado" só porque não bate com a tabela por faixa
  const semExplicacao = validos.filter((i) => !explicados.has(i));
  if (tipo === "negociado" && !semExplicacao.length) tipo = "campanha";

  if (tipo === "negociado") {
    // nenhum item bate com a campanha. Não dá para cobrar faixa, mas o pedido
    // precisa ser conferido — pode ser kit ou campanha de precificação própria.
    // PENDENTE: cadastrar aqui os parâmetros dos kits para conferência automática.
    if (semExplicacao.length) {
      motivos.push({
        nivel: "alerta",
        texto:
          `Preço negociado: ${semExplicacao.length} de ${validos.length} itens não correspondem ` +
          `à tabela Under's Brothers nem a kit ou condição de volume. Conferir na mão`,
      });
    }
    for (const i of semExplicacao) {
      if (!i.produto || i.bruto == null) continue;
      divergentes.push({
        ...i,
        esperado: i.produto.precos[faixa ? faixa.indice : 0],
        dif: null,
        faixaOutra: -1,
        descTabela: 1 - i.bruto / i.produto.tabela,
        pista: `${((1 - i.bruto / i.produto.tabela) * 100).toFixed(1)}% sobre a tabela cheia de ${moeda(i.produto.tabela)}`,
        nivel: "alerta",
      });
    }
  } else {
    if (!habilitado) {
      const tirar = (neg.proteina - neg.teto * neg.totalBruto) / (1 - neg.teto);
      const somar = neg.proteina / neg.teto - neg.totalBruto;
      motivos.push({
        nivel: "erro",
        texto:
          `Não habilitado à campanha: proteína é ${(fatia * 100).toFixed(1)}% ` +
          `${irmaos.length ? "da negociação" : "do pedido"} ` +
          `(${moeda(neg.proteina)} de ${moeda(neg.totalBruto)}), acima do teto de ` +
          `${(neg.teto * 100).toFixed(0)}% (${regime.nome}). Falta tirar ${moeda(tirar)} ` +
          `em proteína ou somar ${moeda(somar)} em mix`,
      });
    } else if (fatia > regime.limite && !neg.campanhaProteina) {
      motivos.push({
        nivel: "aviso",
        texto:
          `Proteína em ${(fatia * 100).toFixed(1)}%, acima do limite de ` +
          `${(regime.limite * 100).toFixed(0)}% — habilitado pela tolerância de ` +
          `${(TOLERANCIA_PROTEINA * 100).toFixed(0)} pontos percentuais`,
      });
    }
    if (regime.semData) {
      motivos.push({ nivel: "alerta", texto: "Pedido sem data legível — aplicada a regra padrão de proteína" });
    } else if (regime.excecao && fatia > LIMITE_PADRAO && !neg.campanhaProteina) {
      motivos.push({
        nivel: "aviso",
        texto:
          `Só se habilita pela ${regime.nome}, que vai até ` +
          `${VIGENCIAS.find((v) => v.nome === regime.nome).ate.split("-").reverse().join("/")}. ` +
          `Pela regra padrão de ${(LIMITE_PADRAO * 100).toFixed(0)}%, estaria bloqueado`,
      });
    }
    if (faixa && faixa.tolerada) {
      motivos.push({
        nivel: "aviso",
        texto:
          `Faltam ${moeda(faixa.falta)} para fechar os ${moeda(neg.totalBruto + faixa.falta)} ` +
          `— subiu para a faixa ${faixa.rotulo} pela tolerância de 2%`,
      });
    }
    if (tipo === "misto" && !temCampanhaPropria) {
      motivos.push({
        nivel: "alerta",
        texto: `${neg.naTabela} de ${neg.itens} itens com preço de campanha — o resto está em preço negociado`,
      });
    }

    if (habilitado && faixa) {
      const ixCarta = faixa.carta ? faixa.carta.indice : -1;
      for (const i of validos) {
        if (explicados.has(i)) continue;
        if (i.foraDoMes) {
          motivos.push({
            nivel: "alerta",
            texto: `${i.nomeErp} saiu da tabela em ${catalogoDe(base.data).nome} — conferir o preço na mão`,
          });
          continue;
        }
        if (!i.produto) {
          motivos.push({ nivel: "alerta", texto: `${i.codigo} ${i.nomeErp} não está na tabela da campanha` });
          continue;
        }
        if (i.unit == null || i.bruto == null) continue;
        const esperado = i.produto.precos[faixa.indice];
        const dif = Number((i.bruto - esperado).toFixed(2));
        if (Math.abs(dif) <= 0.03) continue;
        const outra = i.produto.precos.findIndex((p) => Math.abs(p - i.bruto) <= 0.03);
        const ehCarta = outra >= 0 && outra === ixCarta;
        // índice menor = coluna mais cara. O cliente paga mais do que teria
        // direito, o que é negociação válida: o representante não é obrigado
        // a descer de tabela
        const tabelaMaisCara = outra >= 0 && outra < faixa.indice;
        divergentes.push({
          ...i, esperado, dif, faixaOutra: outra, ehCarta,
          pista: ehCarta
            ? `Carta na Manga — faixa ${FAIXAS[outra].rotulo}`
            : tabelaMaisCara
            ? `preço da faixa ${FAIXAS[outra].rotulo}, acima do devido — negociação válida`
            : outra >= 0
            ? `preço da faixa ${FAIXAS[outra].rotulo}`
            : "preço negociado, fora da tabela",
          // uma faixa acima é Carta na Manga, que o comercial pode conceder;
          // duas ou mais é faixa errada; tabela mais cara não prejudica a empresa
          nivel: ehCarta ? "carta" : tabelaMaisCara ? "info" : outra >= 0 && dif < 0 ? "erro" : "alerta",
        });
      }

      // se a maioria dos itens veio da mesma faixa, o problema (ou a concessão)
      // é do pedido inteiro, não item a item — vale dizer isso de uma vez só
      const porFaixa = new Map();
      for (const d of divergentes) {
        if (d.faixaOutra < 0) continue;
        porFaixa.set(d.faixaOutra, (porFaixa.get(d.faixaOutra) || 0) + 1);
      }
      let dominante = -1, maior = 0;
      for (const [ix, n] of porFaixa) if (n > maior) { maior = n; dominante = ix; }
      if (dominante >= 0 && maior >= Math.max(2, validos.length * 0.5)) {
        const afetados = divergentes.filter((d) => d.faixaOutra === dominante);
        const perda = afetados.reduce((s, d) => s + (d.esperado - d.bruto) * (d.qtde || 0), 0);
        motivos.unshift(
          dominante === ixCarta
            ? {
                nivel: "carta",
                texto:
                  `Carta na Manga — faixa ${FAIXAS[dominante].rotulo}. ${moeda(neg.totalBruto)} ` +
                  `dá a faixa ${faixa.rotulo}, e o pedido está precificado uma faixa acima ` +
                  `(${maior} de ${validos.length} itens, ${moeda(perda)} de concessão)`,
              }
            : dominante < faixa.indice
            ? {
                nivel: "info",
                texto:
                  `Negociado na tabela de ${FAIXAS[dominante].rotulo}. ${moeda(neg.totalBruto)} daria ` +
                  `direito à faixa ${faixa.rotulo}, mas o representante não é obrigado a descer de ` +
                  `tabela — ${maior} de ${validos.length} itens, ${moeda(-perda)} a mais para a empresa`,
              }
            : {
                nivel: "erro",
                texto:
                  `Pedido na faixa de valor errada: ${FAIXAS[dominante].rotulo}. ${moeda(neg.totalBruto)} ` +
                  `corresponde à faixa ${faixa.rotulo} — ${maior} de ${validos.length} itens ` +
                  `estão precificados na faixa ${FAIXAS[dominante].rotulo}` +
                  (perda > 0 ? `, ${moeda(perda)} abaixo do devido` : ""),
              }
        );
      }
    }
  }

  if (temKit) {
    // o kit tem regra comercial própria, já aprovada, que passa por cima de
    // faixa, proteína e margem. Os apontamentos continuam visíveis, mas
    // deixam de barrar o pedido.
    for (const m of motivos) if (!m.kit && (m.nivel === "erro" || m.nivel === "alerta")) m.nivel = "aviso";
    for (const d of divergentes) if (d.nivel !== "info") d.nivel = "info";
    if (motivoMC && motivoMC.nivel !== "info") motivoMC.nivel = "aviso";
    motivos.unshift({
      nivel: "info",
      kit: true,
      texto:
        "Pedido com kit: a condição do kit tem regra comercial própria e já está " +
        "aprovada. Faixa, proteína e margem ficam registradas abaixo, mas não barram",
    });
  }
  if (motivoMC) motivos.unshift(motivoMC);
  if (motivoDebito) motivos.unshift(motivoDebito);

  let veredito = "liberado";
  // erro da própria regra do kit ainda barra; o resto o kit suplanta
  const erroDeKit = motivos.some((m) => m.kit && m.nivel === "erro");
  if (debito) veredito = "inadimplente";
  else if (erroDeKit) veredito = "erro";
  else if (temKit) veredito = "kit";
  else if (motivos.some((m) => m.nivel === "erro") || divergentes.some((d) => d.nivel === "erro"))
    veredito = "erro";
  else if (motivos.some((m) => m.nivel === "carta") || divergentes.some((d) => d.nivel === "carta"))
    veredito = "carta";
  else if (tipo === "negociado") veredito = "negociado";
  // "info" e "aviso" registram o fato sem rebaixar: o pedido passou na regra
  else if (
    motivos.some((m) => m.nivel !== "info" && m.nivel !== "aviso") ||
    divergentes.some((d) => d.nivel !== "info")
  )
    veredito = "alerta";

  return {
    ...base, itens, validos, total, totalBruto, pagto, proteina,
    mix: Number((totalBruto - proteina).toFixed(2)),
    fatia, faixa, regime, debito, passivo, neg, margem,
    habilitado, naTabela: neg.naTabela, adesao: neg.adesao, tipo,
    motivos, divergentes, veredito,
  };
}

/* ============================ armazenamento ============================ */
const CHAVE_HIST = "conferencias:historico";
const CHAVE_NOME = "conferencia:operador";

async function lerGuardado(chave) {
  try {
    const v = localStorage.getItem(chave);
    return v ? JSON.parse(v) : null;
  } catch { return null; }
}
async function gravarGuardado(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); return true; }
  catch { return false; }
}

/* ============================ leitura ============================ */
async function lerPlanilha(arquivo) {
  const nome = arquivo.name.toLowerCase();
  if (nome.endsWith(".csv") || nome.endsWith(".txt")) {
    const buf = await arquivo.arrayBuffer();
    let texto = new TextDecoder("utf-8").decode(buf);
    if (texto.includes("\uFFFD")) texto = new TextDecoder("windows-1252").decode(buf);
    const r = Papa.parse(texto.replace(/^\uFEFF/, ""), { header: true, skipEmptyLines: "greedy" });
    return { colunas: (r.meta.fields || []).filter((c) => c && c.trim()), linhas: r.data };
  }
  const buf = await arquivo.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const aba = wb.Sheets[wb.SheetNames[0]];
  const linhas = XLSX.utils.sheet_to_json(aba, { defval: "", raw: false });
  return { colunas: Object.keys(linhas[0] || {}).filter((c) => c && !c.startsWith("__EMPTY")), linhas };
}

const ESPERADAS = {
  pedido: "PEDIDO", dataPedido: "DATAPEDIDO", cliente: "CLIENTE", codigo: "CODIGO",
  produto: "PRODUTO", qtde: "QTDE", valUnit: "VALUNIT", valTotal: "VALTOTAL",
  bonificado: "BONIFICADO", status: "STATUS", libComl: "LIBCOML", libFin: "LIBFIN",
  condPgto: "CONDPGTO",
};

/* Colunas opcionais: cada uma aceita mais de uma grafia, porque o nome varia
   entre exports ("Observação" e "Observações", "Representante" e "Vendedor") */
const OPCIONAIS = {
  cnpj: ["CNPJCLIENTE", "CNPJ"],
  representante: ["REPRESENTANTE", "VENDEDOR"],
  observacoes: ["OBSERVACAO", "OBSERVACOES", "OBSERVACAOPEDIDO", "OBSERVACOESPEDIDO", "OBS"],
  uf: ["UF", "ESTADO", "UFCLIENTE"],
  mercos: ["PEDIDOMERCOS", "MERCOS"],
  notaFiscal: ["NOTAFISCAL", "NF", "NUMERONF", "NOTA"],
};

function detectarColunas(colunas) {
  const mapa = {};
  const faltando = [];
  const norm = colunas.map((c) => [normalizar(c).replace(/ /g, ""), c]);
  const acha = (alvo) => norm.find(([n]) => n === alvo);
  for (const [chave, alvo] of Object.entries(ESPERADAS)) {
    const achado = acha(alvo);
    if (achado) mapa[chave] = achado[1];
    else faltando.push(alvo);
  }
  for (const [chave, alternativas] of Object.entries(OPCIONAIS)) {
    for (const alvo of alternativas) {
      const achado = acha(alvo);
      if (achado) { mapa[chave] = achado[1]; break; }
    }
  }
  return { mapa, faltando };
}

/* ---------- base de títulos: aba Abertos ---------- */
function formatarDoc(v) {
  const d = String(v ?? "").replace(/\D/g, "");
  if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
  if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");
  return d;
}

const normCnpj = (v) => {
  const d = String(v ?? "").replace(/\D/g, "");
  return d ? d.padStart(14, "0") : "";
};

/* ---------- data de "ontem", no fuso de São Paulo ---------- */
function ontemSP() {
  const agora = new Date();
  const saoPaulo = new Date(agora.toLocaleString("en-US", { timeZone: "America/Sao_Paulo" }));
  saoPaulo.setHours(0, 0, 0, 0);
  saoPaulo.setDate(saoPaulo.getDate() - 1);
  return saoPaulo;
}

function lerData(txt) {
  const t = String(txt ?? "").trim();
  if (!t) return null;
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); // 2026-09-22 00:00:00
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = t.match(/^(\d{2})\/(\d{2})\/(\d{4})/); // 22/09/2026
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  return null;
}

/* ---------- base de títulos ----------
   Aceita dois formatos:
   (a) planilha .xlsx com aba "Abertos" e coluna "Dias Atraso";
   (b) extrato "Detalhamento" (CSV ou xlsx) com uma linha por título em aberto,
       coluna de vencimento e de valor liquidado. Nesse caso, inadimplente é o
       cliente com título NÃO liquidado e vencimento (a data repactuada, quando
       houver) até ontem. */
async function lerTitulos(arquivo) {
  const nome = arquivo.name.toLowerCase();
  let linhas, colunas;

  if (nome.endsWith(".csv") || nome.endsWith(".txt")) {
    const buf = await arquivo.arrayBuffer();
    let texto = new TextDecoder("utf-8").decode(buf);
    if (texto.includes("\uFFFD")) texto = new TextDecoder("windows-1252").decode(buf);
    const r = Papa.parse(texto.replace(/^\uFEFF/, ""), { header: true, skipEmptyLines: "greedy" });
    linhas = r.data;
    colunas = (r.meta.fields || []).filter((c) => c && c.trim());
  } else {
    const buf = await arquivo.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    // prefere a aba "Abertos"; senão, a primeira
    const aba = wb.SheetNames.find((n) => normalizar(n) === "ABERTOS") || wb.SheetNames[0];
    linhas = XLSX.utils.sheet_to_json(wb.Sheets[aba], { defval: "" });
    colunas = Object.keys(linhas[0] || {});
  }

  const norm = (c) => normalizar(c).replace(/ /g, "");
  const acha = (...alvos) => colunas.find((c) => alvos.includes(norm(c)));
  const cCnpj = acha("CNPJ", "CNPJCLIENTE");
  if (!cCnpj) throw new Error("A base de títulos precisa de uma coluna de CNPJ.");

  const cGrupo = acha("GRUPOCNPJ", "GRUPO");
  const cCli = acha("NAME", "NOME", "CLIENTE", "RAZAOSOCIAL");
  const cSit = acha("SITUACAO", "TAGS");
  const cAtraso = acha("DIASATRASO");
  const cVenc = acha("NOVADTVENC", "VENCTO", "VENCIMENTO", "DATAVENCIMENTO");
  const cValor = acha("TOTALRGERAL", "VALOR", "VALORTITULO", "TOTALR");
  const cLiquidado = acha("TOTALRLIQUIDADO", "LIQUIDADO", "RECBTO");

  const limite = ontemSP();
  const mapa = new Map();
  const raizes = new Map();
  // passivo total: TODOS os títulos em aberto do cliente, vencidos ou não
  const aberto = new Map();
  const abertoRaiz = new Map();
  let vencidos = 0;
  let emAberto = 0;

  for (const l of linhas) {
    const cnpj = normCnpj(l[cCnpj]);
    if (!cnpj || /^0+$/.test(cnpj)) continue;

    // se a base informa liquidação, o título quitado não entra em nada
    if (cLiquidado) {
      const liq = paraNumero(l[cLiquidado]);
      const recebido = lerData(l[cLiquidado]);
      if ((liq != null && liq > 0) || recebido) continue;
    }

    const valor = paraNumero(String(l[cValor] ?? "").replace(",", ".")) ?? 0;
    const grupo = cGrupo ? String(l[cGrupo] ?? "").trim() : "";

    // 1) passivo total — todo título em aberto conta
    emAberto += 1;
    const somarAberto = (chave, alvo) => {
      if (!alvo.has(chave)) alvo.set(chave, { titulos: 0, valor: 0 });
      const a = alvo.get(chave);
      a.titulos += 1;
      a.valor += valor;
    };
    somarAberto(cnpj, aberto);
    somarAberto(cnpj.slice(0, 8), abertoRaiz);

    // 2) inadimplência — só o título já vencido
    let atraso = null;
    if (cAtraso) {
      atraso = paraNumero(l[cAtraso]);
      if (atraso == null || atraso < 1) continue;
    } else if (cVenc) {
      const v = lerData(l[cVenc]);
      if (!v || v > limite) continue;
      atraso = Math.round((limite - v) / 86400000) + 1;
    } else {
      continue;
    }
    vencidos += 1;

    const registrar = (chave, alvo) => {
      if (!alvo.has(chave))
        alvo.set(chave, {
          cnpj: chave, cliente: String(l[cCli] ?? "").trim(), grupo,
          titulos: 0, valor: 0, maxAtraso: 0, situacoes: new Set(), empresas: new Set(),
        });
      const r = alvo.get(chave);
      r.titulos += 1;
      r.valor += valor;
      r.maxAtraso = Math.max(r.maxAtraso, atraso);
      r.empresas.add(cnpj);
      const s = cSit ? String(l[cSit] ?? "").trim() : "";
      if (s && s !== "'-" && s !== "-") r.situacoes.add(s);
    };
    registrar(cnpj, mapa);
    registrar(cnpj.slice(0, 8), raizes);
    if (grupo) registrar("g:" + normalizar(grupo), raizes);
  }
  return {
    mapa, raizes, aberto, abertoRaiz,
    linhas: linhas.length, vencidos, emAberto, clientes: mapa.size,
    clientesAberto: aberto.size,
  };
}

function baixarCSV(nome, linhas) {
  const csv = Papa.unparse(linhas, { delimiter: ";" });
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nome; a.click();
  URL.revokeObjectURL(url);
}
